trigger:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.7.0'
  azureServiceConnection: 'devops-connection'
  agentPool: 'epicbook-agent'
  workingDir: '$(System.DefaultWorkingDirectory)'

stages:

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — INIT
# ─────────────────────────────────────────────────────────────────────────────
- stage: TerraformInit
  displayName: 'Stage 1 — Terraform Init'
  jobs:
  - job: init
    pool:
      name: $(agentPool)
    steps:
    - checkout: self

    - script: |
        sudo apt-get update && sudo apt-get install -y unzip curl
        if ! command -v az &> /dev/null; then
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
        wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip -o terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/terraform
      displayName: 'Install Dependencies & Terraform'

    - task: AzureCLI@2
      name: extractCreds
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
          echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;isSecret=true]$servicePrincipalKey"
          echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
          echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"

    - script: |
        cd $(workingDir)
        terraform init
      displayName: 'Terraform Init'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — PLAN
# ─────────────────────────────────────────────────────────────────────────────
- stage: TerraformPlan
  displayName: 'Stage 2 — Terraform Plan'
  dependsOn: TerraformInit
  jobs:
  - job: plan
    pool:
      name: $(agentPool)
    steps:
    - checkout: self

    - task: DownloadSecureFile@1
      name: sshPublicKey
      inputs:
        secureFile: 'id_rsa.pub'

    - script: |
        cd $(workingDir)
        terraform init
        terraform plan \
          -var="public_key=$(sshPublicKey.secureFilePath)" \
          -var="db_admin_password=$(DB_ADMIN_PASSWORD)" \
          -out=tfplan
      displayName: 'Terraform Plan'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        DB_ADMIN_PASSWORD: $(DB_ADMIN_PASSWORD)

    - publish: $(workingDir)/tfplan
      artifact: tfplan

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — APPLY
# ─────────────────────────────────────────────────────────────────────────────
- stage: TerraformApply
  displayName: 'Stage 3 — Terraform Apply'
  dependsOn: TerraformPlan
  jobs:
  - job: apply
    pool:
      name: $(agentPool)
    steps:
    - checkout: self
    - download: current
      artifact: tfplan

    - task: DownloadSecureFile@1
      name: sshPrivateKey
      inputs:
        secureFile: 'id_rsa'

    - task: DownloadSecureFile@1
      name: sshPublicKey
      inputs:
        secureFile: 'id_rsa.pub'

    - script: |
        mkdir -p ~/.ssh
        cp $(sshPrivateKey.secureFilePath) ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        cp $(sshPublicKey.secureFilePath) ~/.ssh/id_rsa.pub
        chmod 644 ~/.ssh/id_rsa.pub
      displayName: 'Install SSH Keys for VM Access'

    - script: |
        cd $(workingDir)
        terraform init
        terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
      displayName: 'Terraform Apply'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — OUTPUTS
# ─────────────────────────────────────────────────────────────────────────────
- stage: PublishOutputs
  displayName: 'Stage 4 — Publish Outputs'
  dependsOn: TerraformApply
  jobs:
  - job: outputs
    pool:
      name: $(agentPool)
    steps:
    - checkout: self

    - script: |
        cd $(workingDir)
        terraform init
        VM_IP=$(terraform output -raw vm_public_ip)
        echo "##vso[task.setvariable variable=VM_PUBLIC_IP]$VM_IP"
        echo "Success! VM is at: $VM_IP"
      displayName: 'Extract VM IP'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)