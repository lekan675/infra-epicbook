trigger:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.7.0'
  azureServiceConnection: 'devops-connection'
  agentPool: 'epicbook-agent'
  # Set this to '.' if your .tf files are in the root, or 'terraform' if in a folder
  workingDir: '$(System.DefaultWorkingDirectory)' 

stages:
- stage: TerraformInit
  displayName: 'Stage 1 — Terraform Init'
  jobs:
  - job: init
    pool:
      name: $(agentPool)
    steps:
    - checkout: self

    # 1. Install Dependencies (Unzip and Azure CLI)
    - script: |
        sudo apt-get update
        sudo apt-get install -y unzip curl
        if ! command -v az &> /dev/null; then
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi
      displayName: 'Install System Dependencies'

    - task: DownloadSecureFile@1
      name: sshPrivateKey
      inputs:
        secureFile: 'id_rsa'

    - task: DownloadSecureFile@1
      name: sshPublicKey
      inputs:
        secureFile: 'id_rsa.pub'

    - script: |
        mkdir -p ~/.ssh
        cp $(sshPrivateKey.secureFilePath) ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        cp $(sshPublicKey.secureFilePath) ~/.ssh/id_rsa.pub
        chmod 644 ~/.ssh/id_rsa.pub
      displayName: 'Install SSH Keys'

    - task: AzureCLI@2
      name: extractCreds
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
          echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;isSecret=true]$servicePrincipalKey"
          echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
          echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"

    - script: |
        wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
        unzip -o terraform_$(terraformVersion)_linux_amd64.zip
        sudo mv terraform /usr/local/bin/terraform
      displayName: 'Install Terraform'

    - script: |
        cd $(workingDir)
        terraform init
      displayName: 'Terraform Init'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

- stage: TerraformPlan
  displayName: 'Stage 2 — Terraform Plan'
  dependsOn: TerraformInit
  jobs:
  - job: plan
    pool:
      name: $(agentPool)
    steps:
    - checkout: self
    
    - task: DownloadSecureFile@1
      name: sshPublicKey
      inputs:
        secureFile: 'id_rsa.pub'

    - script: |
        cd $(workingDir)
        terraform plan \
          -var="public_key=$(sshPublicKey.secureFilePath)" \
          -var="db_admin_password=$(DB_ADMIN_PASSWORD)" \
          -out=tfplan
      displayName: 'Terraform Plan'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        DB_ADMIN_PASSWORD: $(DB_ADMIN_PASSWORD)

    - publish: $(workingDir)/tfplan
      artifact: tfplan